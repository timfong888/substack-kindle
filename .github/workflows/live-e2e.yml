# Manual-only live account end-to-end check.
#
# Runs tests/test_e2e_live_account.py against the REAL account: it fetches the
# live RSS feeds in the registry and SENDS A REAL EPUB to the configured Kindle address. Never runs on
# push/PR — only via the "Run workflow" button (workflow_dispatch).
#
# Required repository secrets:
#   POSTMARK_SERVER_TOKEN      Postmark server token
#   WHITELIST_EMAIL            verified Postmark sender (distinct local-part)
#   KINDLE_EMAIL               Kindle delivery address
#   FEEDS_JSON                 full contents of feeds.json
#                              ({"feeds": ["https://<pub>.substack.com/feed", ...]})
#
# The feed registry is materialized under $RUNNER_TEMP (ephemeral, never the
# workspace) so nothing private is committed or uploaded.

name: live-e2e (real Kindle send)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Window start YYYY-MM-DD (blank = last 7 days)"
        required: false
        default: ""
      end:
        description: "Window end YYYY-MM-DD (blank = last 7 days)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-e2e:
    name: live account e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Materialize feed registry
        env:
          FEEDS_JSON: ${{ secrets.FEEDS_JSON }}
        run: |
          printf '%s' "$FEEDS_JSON" > "$RUNNER_TEMP/feeds.json"

      - name: Live e2e (real RSS fetch + real Postmark send to Kindle)
        env:
          RUN_LIVE_E2E: "1"
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          WHITELIST_EMAIL: ${{ secrets.WHITELIST_EMAIL }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          FEEDS_PATH: ${{ runner.temp }}/feeds.json
          LIVE_E2E_START: ${{ inputs.start }}
          LIVE_E2E_END: ${{ inputs.end }}
        run: pytest tests/test_e2e_live_account.py -s

      - name: Scrub feed registry
        if: always()
        run: rm -f "$RUNNER_TEMP/feeds.json"
